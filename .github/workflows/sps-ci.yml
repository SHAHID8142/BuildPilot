name: sps-ci

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    name: Lint + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: SPS lint
        run: bash scripts/lint-sps.sh

      - name: SPS smoke
        run: bash scripts/smoke-sps.sh
        env:
          CI: "1"
          npm_config_yes: "true"
          NPX_NO_UPDATE_NOTIFIER: "1"

  version-sanity:
    name: Version sanity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: VERSION parses and matches templates
        run: |
          V="$(tr -d '[:space:]' < skill/sps/VERSION)"
          echo "VERSION=$V"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION malformed: $V"; exit 1; }
          grep -qF "SPS version: $V" skill/sps/templates/audit-report.md \
            || { echo "templates/audit-report.md not stamped with $V"; exit 1; }
          grep -qF "Skill version: $V" skill/sps/templates/agent.md \
            || { echo "templates/agent.md not stamped with $V"; exit 1; }
          grep -qF "**Version:** $V" README.md \
            || { echo "README.md version mismatch ($V)"; exit 1; }
          grep -qF "## $V" CHANGELOG.md \
            || { echo "CHANGELOG.md missing $V entry"; exit 1; }

      - name: Script mirrors in sync
        run: |
          diff -rq scripts skill/sps/scripts || { echo "scripts/ and skill/sps/scripts/ drifted"; exit 1; }

      - name: No profile flags in installers (single unified install)
        run: |
          grep -n -- '--profile' install.sh && { echo "install.sh still has --profile"; exit 1; } || true
          grep -n 'Profile' install.ps1 && { echo "install.ps1 still has Profile"; exit 1; } || true
          grep -n 'Profile' get-sps.ps1 && { echo "get-sps.ps1 still has Profile"; exit 1; } || true

      - name: Installer arrays balanced (install.ps1)
        run: |
          grep -c '@(' install.ps1 | awk '{print "open-array-count=" $1}'
          awk 'BEGIN{d=0} /@\(/ {d++} /\)$/ {if (d>0) d--} END{exit (d==0 ? 0 : 1)}' install.ps1 \
            || { echo "unbalanced array literal in install.ps1"; exit 1; }

  powershell-syntax:
    name: PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse all PS1 files
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/check-powershell.ps1

  python-unittest:
    name: Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 is MANDATORY, not an optimisation.
      # framework/sps2/tests/test_attribution_policy.py:49 pins BASELINE_REV to
      # 788bf8a2892ee72705276c9d846626ca0470400d and reads that commit's blob
      # content. A shallow clone cannot resolve it, and 19 tests across 5
      # methods then fail for reasons unrelated to the change under test.
      - name: Checkout (full history required for pinned BASELINE_REV)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python unit tests (deterministic module list)
        working-directory: ${{ github.workspace }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # Pins the repo root on sys.path so the dotted module names below
          # resolve regardless of the invoking CWD. Without this the same
          # command succeeds from the repo root but raises ImportError
          # elsewhere (reproduced: `python3 -m unittest sps2.tests.test_p5`
          # is 48 OK from the repo root, ImportError from /tmp).
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail

          # Deliberately NOT `unittest discover`. In this repository
          # `python3 -m unittest discover -s . -t .` locates ZERO tests and
          # exits 5 ("NO TESTS RAN") because framework/sps2/, framework/sps2/tests/ and framework/domain/
          # carry no __init__.py, so the stdlib loader will not recurse into
          # them. Discovery is unusable as a gate: it cannot demonstrate the
          # suite ran.
          #
          # The module list is derived from TRACKED files so the gate is
          # deterministic and cannot silently absorb or drop modules.
          MODULES=()
          while IFS= read -r MODULE; do
            MODULES+=("$MODULE")
          done < <(
            git ls-files 'test_*.py' '**/test_*.py' \
              | sed -e 's/\.py$//' -e 's|/|.|g' \
              | sort -u
          )

          if [ "${#MODULES[@]}" -eq 0 ]; then
            echo "::error::No test modules found; refusing to report success."
            exit 1
          fi

          printf 'Test modules (%d):\n' "${#MODULES[@]}"
          printf '  %s\n' "${MODULES[@]}"

          # --- zero-test guard -------------------------------------------------
          # unittest exits 5 on "NO TESTS RAN", which `set -e` already catches,
          # but a partially-empty run exits 0. Capture output and assert the
          # parsed test count against MIN_TESTS so a green build cannot mean
          # zero executed tests. Raise MIN_TESTS as the suite grows.
          MIN_TESTS=500

          set +e
          OUTPUT="$(python3 -m unittest -v "${MODULES[@]}" 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          RAN="$(printf '%s\n' "$OUTPUT" | sed -n 's/^Ran \([0-9][0-9]*\) test.*/\1/p' | tail -1)"
          RAN="${RAN:-0}"
          echo "Executed test count: ${RAN} (minimum required: ${MIN_TESTS})"

          if [ "${RAN}" -eq 0 ]; then
            echo "::error::Zero tests executed. A zero-test run is a FAILURE, never a success."
            exit 1
          fi

          if [ "${RAN}" -lt "${MIN_TESTS}" ]; then
            echo "::error::Only ${RAN} tests executed, below the required minimum of ${MIN_TESTS}. Either tests were lost or the module list is incomplete."
            exit 1
          fi

          # --- per-module presence guard ---------------------------------------
          # A total threshold cannot see a module whose tests silently stopped
          # running, nor one whose file was deleted (deletion removes it from
          # git ls-files, so the discovered list shrinks with it). Compare the
          # discovered set against a COMMITTED manifest instead.
          MANIFEST=".github/expected-test-modules.txt"
          if [ ! -f "${MANIFEST}" ]; then
            echo "::error::missing ${MANIFEST}; refusing to report success without a module baseline."
            exit 1
          fi
          ABSENT=0
          while IFS= read -r EXPECTED; do
            [ -n "${EXPECTED}" ] || continue
            if ! printf '%s\n' "${MODULES[@]}" | grep -qxF "${EXPECTED}"; then
              echo "::error::expected test module ${EXPECTED} was not discovered."
              ABSENT=$((ABSENT+1))
            fi
          done < "${MANIFEST}"
          ZERO=0
          LOG="$(mktemp "${TMPDIR:-/tmp}/unittest-guard.XXXXXX")"
          printf '%s\n' "$OUTPUT" > "$LOG"
          # NOTE: grep -q on a PIPE with a large stream lets grep exit early and
          # printf die of SIGPIPE; under GitHub Actions' `bash -eo pipefail` that
          # turns a HEALTHY match into a false "executed 0 tests" failure
          # (reproduced: pipeline exit 141). Grep a FILE instead - no pipe, no
          # SIGPIPE, no race.
          for MODULE in "${MODULES[@]}"; do
            if ! grep -qF "(${MODULE}." "$LOG"; then
              echo "::error::module ${MODULE} executed 0 tests."
              ZERO=$((ZERO+1))
            fi
          done
          rm -f "$LOG"
          if [ "${ABSENT}" -ne 0 ] || [ "${ZERO}" -ne 0 ]; then
            echo "::error::module guard failed: ${ABSENT} absent, ${ZERO} executed zero tests."
            exit 1
          fi
          echo "Per-module guard: all $(wc -l < "${MANIFEST}" | tr -d ' ') expected modules present and executed."

          if [ "${STATUS}" -ne 0 ]; then
            echo "::error::unittest exited ${STATUS} with ${RAN} tests executed."
            exit "${STATUS}"
          fi

      # OPTIONAL, OFF BY DEFAULT. framework/sps2/tools/test-portability.py is RED at HEAD
      # (33 passed, 6 failed, 14 controls) and is NOT part of the supported
      # suite. Do not enable until it is green and explicitly approved.
      # - name: Portability exercise (excluded: red at HEAD)
      #   run: python3 framework/sps2/tools/test-portability.py
