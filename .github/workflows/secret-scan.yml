name: secret-scan

# T-25: secrets-leak CI gate. Runs scripts/secret-scan.sh over tracked files,
# the diff vs origin/main, and agent/MCP config surfaces (.claude/**, .mcp.json).
# Any secret-shaped hit blocks the build (exit 1). Allowlist: .secrets-allowlist
# (repo root) — keep entries minimal and auditable; every entry is a hole.

"on":
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan tracked files + diff for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for diff vs origin/main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run secret scan
        run: |
          bash scripts/secret-scan.sh
